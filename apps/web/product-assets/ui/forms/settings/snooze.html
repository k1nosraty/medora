      <section id="snooze-settings" class="settings-panel" hidden>
        <form id="snooze-form">
          <p class="quiet">{{msg:ui.when-you-snooze-a-dose-medora-reminds-you-again-after-thi}}</p>
          <fieldset class="settings-choices"><legend>{{msg:ui.medicine-reminder-snooze}}</legend>
            <label><input type="radio" name="snooze-preset" value="10" checked><span>{{msg:ui.10-minutes}}</span></label>
            <label><input type="radio" name="snooze-preset" value="30"><span>{{msg:ui.30-minutes}}</span></label>
            <label><input type="radio" name="snooze-preset" value="60"><span>{{msg:ui.60-minutes}}</span></label>
            <label><input type="radio" name="snooze-preset" value="custom"><span>{{msg:ui.custom-2}}</span></label>
          </fieldset>
          <label id="snooze-custom-row" hidden>{{msg:ui.snooze-duration-minutes}}<input id="snooze-minutes" dir="ltr" inputmode="numeric" maxlength="4"></label>
          <button type="submit" class="block-action">{{msg:ui.save-snooze-duration}}</button>
        </form>
      </section>
