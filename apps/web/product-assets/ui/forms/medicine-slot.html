  <template id="slot-template">
    <div class="slot">
      <div class="slot-heading"><strong></strong><button type="button" class="remove-slot text-button danger-link">{{msg:ui.remove-dose}}</button></div>
      <div class="slot-fields">
        <label>{{msg:ui.dose-time}}<input class="time" type="time" dir="ltr" value="08:00" required></label>
        <div class="dose-field">
          <label>{{msg:ui.dose-optional}}<input class="amount" inputmode="decimal" dir="ltr" maxlength="15" placeholder="{{msg:ui.e-g-0-5}}"></label>
          <div class="dose-quick-values" role="group" aria-label="{{msg:ui.quick-dose-amounts}}">
            <button type="button" class="secondary" data-dose-value="250" aria-label="{{msg:ui.a-quarter-unit}}">¼</button>
            <button type="button" class="secondary" data-dose-value="500" aria-label="{{msg:ui.half-a-unit}}">½</button>
            <button type="button" class="secondary" data-dose-value="1000" aria-label="{{msg:ui.one-unit}}">{{msg:ui.1}}</button>
          </div>
        </div>
      </div>
    </div>
  </template>
