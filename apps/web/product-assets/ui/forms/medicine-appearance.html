  <dialog id="appearance-dialog" class="sheet" aria-labelledby="appearance-title">
    <div class="sheet-body">
      <h2 id="appearance-title">{{msg:ui.appearance-optional}}</h2>
      <h3 id="medicine-icons-title">{{msg:ui.medicine-form}}</h3>
      <div id="medicine-icons" class="appearance-grid" role="group" aria-labelledby="medicine-icons-title"></div>
      <h3 id="medicine-colors-title">{{msg:ui.medicine-color}}</h3>
      <div id="medicine-colors" class="appearance-grid" role="group" aria-labelledby="medicine-colors-title"></div>
      <div id="appearance-preview" class="feature medicine"><span id="appearance-preview-icon"></span>{{msg:ui.preview}}</div>
      <button type="button" id="appearance-confirm" class="block-action">{{msg:ui.select}}</button>
      <button type="button" class="text-button block-action" data-close="appearance-dialog">{{msg:ui.cancel}}</button>
    </div>
  </dialog>
