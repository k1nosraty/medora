  <dialog id="time-picker" class="sheet value-picker" aria-labelledby="time-picker-title">
    <form id="time-form" class="sheet-form sheet-body">
      <h2 id="time-picker-title">{{msg:ui.choose-a-time}}</h2>
      <p class="quiet time-hint">{{msg:ui.enter-the-time-in-24-hour-format}}</p>
      <div class="time-inputs" dir="ltr">
        <label dir="auto">{{msg:ui.time}}<input id="keyboard-hour" dir="ltr" inputmode="numeric" maxlength="2" autocomplete="off" autofocus></label>
        <span aria-hidden="true">:</span>
        <label dir="auto">{{msg:ui.minutes}}<input id="keyboard-minute" dir="ltr" inputmode="numeric" maxlength="2" autocomplete="off"></label>
      </div>
      <p id="time-error" class="field-error" role="alert"></p>
      <div class="action-pair picker-actions">
        <button type="button" class="secondary" data-close="time-picker">{{msg:ui.cancel}}</button>
        <button type="submit" id="picker-time-confirm">{{msg:ui.select}}</button>
      </div>
    </form>
  </dialog>
