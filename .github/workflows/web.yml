name: Check Medora web

on:
  pull_request:
  push:
    branches: ['feature/**', 'fix/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @medora/compat-worker run typecheck
      - run: pnpm audit --audit-level=high
      - run: pnpm --filter @medora/compat-worker test
      - run: pnpm --filter @medora/compat-worker run test:care
      - run: pnpm --filter @medora/compat-worker run test:alarms
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:incumbent
