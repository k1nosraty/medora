name: Deploy Medora web

on:
  push:
    branches: [deploy]

permissions:
  contents: read

concurrency:
  group: medora-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: pnpm
      - name: Install and test the web app
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @medora/compat-worker run typecheck
          pnpm audit --audit-level=high
          pnpm --filter @medora/compat-worker test
          pnpm --filter @medora/compat-worker run test:care
          pnpm --filter @medora/compat-worker run test:alarms
      - name: Verify Chromium and WebKit flows
        run: |
          pnpm exec playwright install --with-deps chromium webkit
          pnpm test:incumbent --reporter=list
      - name: Publish to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN to the repository's Actions secrets."
            exit 1
          fi
          pnpm --filter @medora/compat-worker run deploy --keep-vars --tag "$GITHUB_SHA" --var "MEDORA_RELEASE:$GITHUB_SHA"
      - name: Check the scheduled release notification
        run: |
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 4 --max-time 20 \
            "https://medorapp.ir/api/operations/release?version=$GITHUB_SHA" |
            jq -e --arg version "$GITHUB_SHA" '.version == $version and (.status == "pending" or .status == "queued" or .status == "complete" or .status == "paused")'
