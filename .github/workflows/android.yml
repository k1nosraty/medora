name: Android checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prefer official repositories in CI
        run: sed -i '/maven.aliyun.com/d' settings.gradle.kts
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: medora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew -p care-core jvmTest buildWebEngine
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run test:care
        working-directory: web
      - run: npm run test:alarms
        working-directory: web
      - run: npm run deploy -- --dry-run
        working-directory: web
