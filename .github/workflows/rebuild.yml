name: Verify Medora rebuild
on:
  pull_request:
  push:
    branches: ['codex/medora-2-full-rebuild']
  workflow_dispatch:
    inputs:
      archive_candidate:
        description: Upload the verified candidate artifact after separate approval
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: medora
          POSTGRES_DB: medora_fixture
          POSTGRES_PASSWORD: fixture-ci-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U medora" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://medora:fixture-ci-only@127.0.0.1:5432/medora_fixture
      MEDORA_TEST_DATABASE_URL: postgresql://medora:fixture-ci-only@127.0.0.1:5432/medora_fixture
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24.18.0', cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm typecheck && pnpm lint
      - run: pnpm db:migrate && pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      - name: Validate isolated Cloudflare configuration without generating or deploying it
        env:
          MEDORA_STAGE_ACCOUNT: "0123456789abcdef0123456789abcdef"
          MEDORA_STAGE_HYPERDRIVE: "abcdef0123456789abcdef0123456789"
          MEDORA_STAGE_BUCKET: medora-fixture-staging
        run: |
          node infrastructure/cloudflare/staging.mjs --check
          node infrastructure/cloudflare/staging.mjs --portable --check
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:product --reporter=list,github
      - run: node scripts/verification/product-runtime.mjs
      - name: Exercise generation fencing and post-write rollback on a fresh database
        env:
          PGDATABASE: medora_fixture
          PGHOST: 127.0.0.1
          PGUSER: medora
          PGPASSWORD: fixture-ci-only
          MEDORA_TEST_DATABASE_URL: postgresql://medora:fixture-ci-only@127.0.0.1:5432/medora_transition
        run: |
          createdb medora_transition
          mkdir -p dist
          node scripts/verification/rehearse.mjs > dist/reconciliation.json
          createdb medora_unmapped
          MEDORA_TEST_DATABASE_URL="${MEDORA_TEST_DATABASE_URL%/*}/medora_unmapped" node scripts/verification/rehearse.mjs --unmapped > dist/recovery-refusal.json
          createdb medora_erase_imported
          MEDORA_TEST_DATABASE_URL="${MEDORA_TEST_DATABASE_URL%/*}/medora_erase_imported" node scripts/verification/rehearse.mjs --erase-imported > dist/imported-account-erasure.json
          createdb medora_fixture_source
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          umask 077
          openssl rand -hex 32 > "$work/archive-key"
          node scripts/verification/legacy-source.mjs "$work/source"
          MEDORA_TEST_DATABASE_URL="${MEDORA_TEST_DATABASE_URL%/*}/medora_fixture_source" MEDORA_ARCHIVE_KEY_FILE="$work/archive-key" node scripts/verification/source-reconciliation.mjs --synthetic "$work/source/do" "$work/source/census.json" "$work/source/identity.json" "$work/check" > dist/source-copy.json
      - name: Rehearse PostgreSQL and R2 migration with offline browsers
        run: |
          export PGHOST=127.0.0.1 PGUSER=medora PGPASSWORD=fixture-ci-only
          export TMPDIR="$RUNNER_TEMP"
          export MEDORA_PG_BIN="$RUNNER_TEMP/medora-pg-tools"
          mkdir -p "$MEDORA_PG_BIN" dist
          for tool in pg_dump pg_restore; do
            cat > "$MEDORA_PG_BIN/$tool" <<'SH'
          #!/bin/sh
          root="$(cd "$(dirname "$0")/.." && pwd)"
          exec docker run --rm --pull never --network host --user "$(id -u):$(id -g)" \
            --env PGHOST --env PGPORT --env PGUSER --env PGPASSWORD --env PGDATABASE --env PGCONNECT_TIMEOUT \
            --mount "type=bind,src=$root,dst=$root" postgres:17.11-alpine "$(basename "$0")" "$@"
          SH
            chmod +x "$MEDORA_PG_BIN/$tool"
          done
          for slot in SOURCE TARGET ABORTED RECOVERY; do
            name="medora_handoff_${slot,,}"
            createdb "$name"
            export "MEDORA_HANDOFF_$slot=${MEDORA_TEST_DATABASE_URL%/*}/$name"
          done
          node scripts/verification/postgres-handoff.mjs > dist/postgres-handoff.json
      - run: pnpm test:compat
      - run: pnpm test:incumbent --reporter=list,github
      - run: node scripts/verification/visual-parity.mjs > dist/visual-parity.json
      - run: node tests/browser/measure.mjs apps/web/dist 3 > dist/performance-product.json
      - run: pnpm test:e2e
      - run: node scripts/verification/pwa-update.mjs
      - run: node scripts/verification/frontend-independence.mjs --offline
      - name: Build both Worker adapters
        run: |
          node scripts/verification/bundle-worker.mjs infrastructure/cloudflare/candidate.mjs dist/worker/candidate.js
          node scripts/verification/bundle-worker.mjs apps/api/src/adapters/worker.ts dist/worker/portable.js
      - name: Exercise standalone storage, Node and reverse proxy
        run: |
          config="$RUNNER_TEMP/medora-fixture.env"
          node scripts/verification/local-env.mjs "$config"
          docker compose --env-file "$config" -p medora-ci up -d --build --wait
          set -a
          . "$config"
          set +a
          env -u MEDORA_TEST_DATABASE_URL MEDORA_TEST_COMPOSE_ENV="$config" MEDORA_TEST_COMPOSE_PROJECT=medora-ci node scripts/verification/runtime.mjs http://127.0.0.1:8808
          node scripts/verification/accounts.mjs http://127.0.0.1:8808 http://127.0.0.1:8810
          node scripts/verification/worker.mjs http://127.0.0.1:8810
          timeout 35s node scripts/verification/insights-gateway.mjs http://127.0.0.1:8808
          bash scripts/verification/restore-compose.sh "$config" medora-ci "$RUNNER_TEMP/medora-restore"
      - name: Identify and package verified candidate
        run: |
          node scripts/verification/artifacts.mjs dist/worker > dist/release-manifest.json
          tar -czf "$RUNNER_TEMP/medora-candidate.tar.gz" apps/web/dist apps/api/dist dist/worker dist/release-manifest.json dist/reconciliation.json dist/recovery-refusal.json dist/imported-account-erasure.json dist/postgres-handoff.json dist/source-copy.json dist/visual-parity.json dist/performance-product.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.archive_candidate
        with:
          name: medora-candidate
          path: ${{ runner.temp }}/medora-candidate.tar.gz
          if-no-files-found: error
