name: Navigation device QA
on:
  push:
    branches: [ui/wellness-navigation]
  pull_request:
    paths:
      - 'app/src/**'
      - '.github/workflows/navigation-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Prefer official repositories in CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('settings.gradle.kts')
          p.write_text(p.read_text().replace('        maven { url = uri("https://maven.aliyun.com/repository/google") }\n', ''))
          PY
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=ir.medora.health.WellnessUiTest#compactPersianLightNavigation,ir.medora.health.WellnessUiTest#compactEnglishDarkNavigation,ir.medora.health.WellnessUiTest#compactPersianDarkNavigation,ir.medora.health.WellnessUiTest#compactEnglishLightNavigation,ir.medora.health.WellnessUiTest#medicationTabDoesNotDisplayAppointmentsAfterNavigation,ir.medora.health.TimeDialogTest'
            mkdir -p device-screenshots
            adb pull /sdcard/Android/data/ir.medora.health.android/files/screenshots device-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-qa-results
          path: |
            device-screenshots/
            app/build/reports/
            app/build/outputs/androidTest-results/
