name: Publish Android preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medora-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug --stacktrace
      - name: Publish installable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Medora-v0.2.0-preview.apk
          sha256sum Medora-v0.2.0-preview.apk > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Medora 0.2.0 — Soft Wellness preview

          - Redesigned water, medication and appointment screens.
          - Water progress ring, quick logging and bottom sheet editors.
          - Activity calendar and water/medication reports using real data.
          - Persian/English support and dark mode.
          - Fixes for dose updates, reminder behavior and ambiguous progress labels.

          Download Medora-v0.2.0-preview.apk to install on Android 8 or later.
          This preview APK uses the Android debug signing key. Updates from an existing installation may require a matching signing key.
          Validation: unit tests, debug APK build, instrumentation-test compilation and Android lint. Device instrumentation tests are not run by this release workflow.
          NOTES
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.2.0 already exists; leaving it unchanged."
          else
            gh release create v0.2.0 Medora-v0.2.0-preview.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Medora 0.2.0 — Soft Wellness Preview" --notes-file release-notes.md --prerelease
          fi
