name: Publish Android preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medora-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Use official Maven repositories for CI
        run: sed -i '/maven.aliyun.com/d' settings.gradle.kts
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug --stacktrace
      - name: Publish installable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Medora-v0.2.1-preview.apk
          sha256sum Medora-v0.2.1-preview.apk > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Medora 0.2.1 — Wellness Navigation preview

          - Fixed time-picker crashes when adding medication or appointments.
          - Medication tab now excludes appointments.
          - Separate Today medication and appointment sections with lavender appointment cards.
          - Rounded bottom navigation with a central Today button.
          - Settings and Reports/calendar are accessible from the bottom dock.
          - Compact Persian/English labels and light/dark theme support.

          Download Medora-v0.2.1-preview.apk to install on Android 8 or later.
          This preview APK uses the Android debug signing key. Updates from an existing installation may require a matching signing key.
          Validation: unit tests, debug APK build, instrumentation-test compilation and Android lint. Six device checks passed on Android 10, covering 320dp Persian/English light/dark navigation, medication isolation and the time dialog. QA screenshots: https://github.com/k1nosraty/medora/actions/runs/38071093125
          NOTES
          if gh release view v0.2.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.2.1 already exists; leaving it unchanged."
          else
            gh release create v0.2.1 Medora-v0.2.1-preview.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Medora 0.2.1 — Wellness Navigation Preview" --notes-file release-notes.md --prerelease
          fi
