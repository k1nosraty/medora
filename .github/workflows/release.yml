name: Publish Medora preview
on:
  push:
    tags: ['v*-preview']

permissions:
  contents: read
concurrency:
  group: medora-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/android.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: medora-debug-apk
      - name: Publish checked APK and changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          android_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*$/\1/p' app/build.gradle.kts)"
          test "$version" = "$android_version"
          test "$version" = "$(jq -er '.version' web/package.json)"

          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

          apk="Medora-$GITHUB_REF_NAME.apk"
          mv app-debug.apk "$apk"
          sha256sum "$apk" > SHA256SUMS.txt

          if draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"; then
            if [ "$draft" = true ]; then
              gh release upload "$GITHUB_REF_NAME" "$apk" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false \
                --notes-file release-notes.md --prerelease --latest=false
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$apk" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Medora $version" --notes-file release-notes.md --prerelease --latest=false
          fi
