  <dialog id="visit-dialog" class="sheet" aria-labelledby="visit-form-title">
    <form id="visit-editor" class="sheet-form" novalidate>
      <div class="sheet-header"><svg aria-hidden="true"><use href="#i-mark"/></svg><h2 id="visit-form-title">{{msg:ui.new-appointment}}</h2><button class="icon-button" type="button" data-close="visit-dialog" aria-label="{{msg:ui.close}}"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div>
      <div class="sheet-body">
        <label class="editor-field">{{msg:ui.clinician-or-appointment-name}}<input id="visit-name" maxlength="120" required></label>
        <div class="visit-when">
          <label class="editor-field">{{msg:ui.appointment-date}}<input id="visit-day" type="date" required></label>
          <label class="editor-field">{{msg:ui.appointment-time}}<input id="visit-time" type="time" step="1" required></label>
        </div>
        <p id="visit-zone-summary" class="quiet"></p>
        <label class="editor-field">{{msg:ui.location}}<input id="visit-place" maxlength="160"></label>
        <details id="visit-appearance" class="editor-options">
          <summary><span class="visit-appearance-dot" aria-hidden="true"></span>{{msg:ui.visit-appearance-optional}}</summary>
          <div id="visit-appearance-preview" class="visit-banner"></div>
          <div class="visit-type-field">
            <span id="visit-type-label">{{msg:ui.visit-type}}</span>
            <button id="visit-category-open" type="button" class="secondary" aria-haspopup="dialog" aria-labelledby="visit-type-label visit-category-selected"><span id="visit-category-selected"></span><svg aria-hidden="true"><use href="#i-search"/></svg></button>
            <select id="visit-category" hidden>
              <option value="general">{{msg:ui.general}}</option>
              <optgroup label="پزشکان و تخصص‌ها">
                <option value="family">{{msg:ui.family-medicine}}</option>
                <option value="internal">{{msg:ui.internal-medicine}}</option>
                <option value="pediatrics">{{msg:ui.pediatrics}}</option>
                <option value="obgyn">{{msg:ui.obstetrics-and-gynecology}}</option>
                <option value="midwife">{{msg:ui.midwifery}}</option>
                <option value="eye">{{msg:ui.eye-care}}</option>
                <option value="ent">{{msg:ui.ear-nose-and-throat}}</option>
                <option value="skin">{{msg:ui.dermatology}}</option>
                <option value="heart">{{msg:ui.cardiology}}</option>
                <option value="neurology">{{msg:ui.neurology}}</option>
                <option value="psychiatry">{{msg:ui.psychiatry}}</option>
                <option value="endocrine">{{msg:ui.endocrinology}}</option>
                <option value="gastro">{{msg:ui.gastroenterology-and-hepatology}}</option>
                <option value="pulmonology">{{msg:ui.pulmonology}}</option>
                <option value="nephrology">{{msg:ui.nephrology}}</option>
                <option value="urology">{{msg:ui.urology}}</option>
                <option value="rheumatology">{{msg:ui.rheumatology}}</option>
                <option value="allergy">{{msg:ui.allergy-and-immunology}}</option>
                <option value="infectious">{{msg:ui.infectious-diseases}}</option>
                <option value="hematology">{{msg:ui.hematology}}</option>
                <option value="oncology">{{msg:ui.oncology}}</option>
                <option value="geriatrics">{{msg:ui.geriatrics}}</option>
                <option value="general-surgery">{{msg:ui.general-surgery}}</option>
                <option value="orthopedics">{{msg:ui.orthopedics}}</option>
                <option value="pain">{{msg:ui.pain-medicine}}</option>
                <option value="sleep">{{msg:ui.sleep-medicine}}</option>
                <option value="occupational-medicine">{{msg:ui.occupational-medicine}}</option>
              </optgroup>
              <optgroup label="دندان و خدمات درمانی">
                <option value="dental">{{msg:ui.dental}}</option>
                <option value="orthodontics">{{msg:ui.orthodontics}}</option>
                <option value="endodontics">{{msg:ui.endodontics}}</option>
                <option value="psychology">{{msg:ui.psychology}}</option>
                <option value="physiotherapy">{{msg:ui.physiotherapy}}</option>
                <option value="occupational-therapy">{{msg:ui.occupational-therapy}}</option>
                <option value="speech">{{msg:ui.speech-therapy}}</option>
                <option value="audiology">{{msg:ui.audiology}}</option>
                <option value="optometry">{{msg:ui.optometry}}</option>
                <option value="nutrition">{{msg:ui.nutrition}}</option>
                <option value="sports">{{msg:ui.sports-medicine}}</option>
              </optgroup>
              <optgroup label="آزمایش، تصویربرداری و سایر خدمات">
                <option value="lab">{{msg:ui.laboratory}}</option>
                <option value="imaging">{{msg:ui.imaging}}</option>
                <option value="radiology">{{msg:ui.radiology}}</option>
                <option value="ultrasound">{{msg:ui.ultrasound}}</option>
                <option value="mri">{{msg:ui.mri}}</option>
                <option value="ct">{{msg:ui.ct-scan}}</option>
                <option value="mammography">{{msg:ui.mammography}}</option>
                <option value="densitometry">{{msg:ui.bone-density-scan}}</option>
                <option value="ecg">{{msg:ui.ecg}}</option>
                <option value="echocardiography">{{msg:ui.echocardiogram}}</option>
                <option value="endoscopy">{{msg:ui.endoscopy}}</option>
                <option value="dialysis">{{msg:ui.dialysis}}</option>
                <option value="vaccination">{{msg:ui.vaccination}}</option>
                <option value="nuclear-medicine">{{msg:ui.nuclear-medicine}}</option>
              </optgroup>
              <option value="custom">{{msg:ui.custom}}</option>
            </select>
          </div>
          <label class="editor-field" id="visit-category-name-field" hidden>{{msg:ui.custom-category-name-optional}}<input id="visit-category-name" dir="auto" maxlength="60"></label>
          <fieldset id="visit-colors"><legend>{{msg:ui.visit-color}}</legend><div class="visit-color-grid"></div></fieldset>
        </details>
        <details id="visit-extra" class="editor-options"><summary>{{msg:ui.more-options}}</summary>
          <label class="editor-field">{{msg:ui.contact-information}}<input id="visit-contact" maxlength="160"></label>
          <label class="editor-field">{{msg:ui.notes}}<textarea id="visit-note" maxlength="600" rows="2"></textarea></label>
        </details>
        <details id="visit-reminder-options" class="editor-options">
          <summary>{{msg:ui.appointment-reminders-2}}</summary>
          <label class="feature-head editor-switch">{{msg:ui.remind-me-about-this-appointment}}<input id="visit-reminders-enabled" type="checkbox" role="switch" checked></label>
          <fieldset class="reminder-options" id="visit-reminder-offsets"><legend>{{msg:ui.early-reminders-optional}}</legend>
            <label><input type="checkbox" name="visit-offset" value="60">{{msg:ui.one-hour-before}}</label>
            <label><input type="checkbox" name="visit-offset" value="120">{{msg:ui.two-hours-before}}</label>
            <label><input type="checkbox" name="visit-offset" value="1440">{{msg:ui.one-day-before}}</label>
          </fieldset>
        </details>
        <p id="visit-reminder-summary" class="quiet" aria-live="polite"></p>
        <p id="visit-error" role="alert" class="field-error"></p>
        <button type="submit" class="block-action">{{msg:ui.save-appointment}}</button>
        <button type="button" id="delete-edited-visit" class="text-button danger-link block-action" hidden>{{msg:ui.delete-appointment}}</button>
        <button type="button" class="text-button block-action" data-close="visit-dialog">{{msg:ui.cancel}}</button>
      </div>
    </form>
  </dialog>
