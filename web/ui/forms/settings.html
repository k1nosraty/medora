  <dialog id="settings-dialog" class="settings-dialog shared-panel" aria-labelledby="settings-title">
    <div class="sheet-header">
      <span id="settings-heading-art" aria-hidden="true"></span>
      <button type="button" id="settings-back" class="icon-button" aria-label="{{msg:ui.back-to-settings}}" hidden><svg aria-hidden="true"><use href="#i-back"/></svg></button>
      <div><h2 id="settings-title" tabindex="-1">{{msg:ui.medora-settings}}</h2><p id="settings-subtitle">{{msg:ui.appearance-reminders-and-data}}</p></div>
      <button class="icon-button" type="button" data-close="settings-dialog" aria-label="{{msg:ui.close}}"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div id="settings-content" class="sheet-body">
      <div id="settings-home">
        <button type="button" class="settings-hero" data-settings-panel="notification-settings">
          <span class="settings-hero-copy"><strong>{{msg:ui.notifications-on-this-device}}</strong><small>{{msg:ui.medicine-water-appointment-and-routine-reminders}}</small><span id="settings-notification-state" class="settings-state">{{msg:ui.checking}}</span></span>
          <span class="settings-hero-art" aria-hidden="true"><svg data-surface-art="notification"><use href="#i-bell"/></svg></span>
        </button>
        <h3>{{msg:ui.reminders}}</h3>
        <div class="settings-group">
          <button type="button" class="settings-row water-row" data-settings-panel="water-settings">
            <span class="settings-icon"><svg data-surface-art="water" aria-hidden="true"><use href="#i-water"/></svg></span>
            <span>{{msg:ui.water}}<small id="settings-water-summary"></small></span><svg class="settings-chevron" aria-hidden="true"><use href="#i-back"/></svg>
          </button>
          <button type="button" class="settings-row medicine-row" data-settings-panel="snooze-settings">
            <span class="settings-icon"><svg data-surface-art="bottle" aria-hidden="true"><use href="#i-pill"/></svg></span>
            <span>{{msg:ui.medication-reminder-snooze}}<small id="settings-snooze-summary"></small></span><svg class="settings-chevron" aria-hidden="true"><use href="#i-back"/></svg>
          </button>
          <button type="button" class="settings-row visit-row" data-settings-panel="appointment-settings">
            <span class="settings-icon"><svg data-surface-art="visit" aria-hidden="true"><use href="#i-calendar"/></svg></span>
            <span>{{msg:ui.appointment-settings}}<small id="settings-appointment-summary"></small></span><svg class="settings-chevron" aria-hidden="true"><use href="#i-back"/></svg>
          </button>
        </div>
        <h3>{{msg:ui.app-and-data}}</h3>
        <div class="settings-group">
          <button type="button" class="settings-row" data-settings-panel="profile-settings">
            <span class="settings-icon"><svg data-surface-art="control-user" aria-hidden="true"><use href="#i-user"/></svg></span>
            <span>{{msg:ui.profile}}<small>{{msg:ui.gender-and-cycle-visibility}}</small></span><svg class="settings-chevron" aria-hidden="true"><use href="#i-back"/></svg>
          </button>
          <button type="button" class="settings-row" data-settings-panel="display-settings">
            <span class="settings-icon"><svg data-surface-art="control-sun" aria-hidden="true"><use href="#i-sun"/></svg></span>
            <span>{{msg:ui.appearance-and-language}}<small id="settings-display-summary"></small></span><svg class="settings-chevron" aria-hidden="true"><use href="#i-back"/></svg>
          </button>
          <button type="button" class="settings-row" id="settings-open-family" aria-haspopup="dialog" aria-controls="family-dialog">
            <span class="settings-icon"><svg data-surface-art="control-user" aria-hidden="true"><use href="#i-user"/></svg></span>
            <span>{{msg:ui.care-groups}}<small>{{msg:ui.groups-and-members}}</small></span><svg class="settings-chevron" aria-hidden="true"><use href="#i-back"/></svg>
          </button>
          <button type="button" class="settings-row" data-settings-panel="backup-settings">
            <span class="settings-icon"><svg data-surface-art="backup" aria-hidden="true"><use href="#i-lock"/></svg></span>
            <span>{{msg:ui.backups}}<small>{{msg:ui.create-or-restore-an-encrypted-backup}}</small></span><svg class="settings-chevron" aria-hidden="true"><use href="#i-back"/></svg>
          </button>
          <button type="button" class="settings-row" data-open-account>
            <span class="settings-icon"><svg data-surface-art="control-user" aria-hidden="true"><use href="#i-user"/></svg></span>
            <span>{{msg:ui.medora-account}}<small>{{msg:ui.optional-sign-in-with-a-username}}</small></span><svg class="settings-chevron" aria-hidden="true"><use href="#i-back"/></svg>
          </button>
        </div>
        <button id="open-support" type="button" class="secondary block-action">{{msg:ui.report-an-issue-and-view-replies}}</button>
      </div>
      <!-- include forms/settings/display.html -->
      <!-- include forms/settings/profile.html -->
      <!-- include forms/settings/notification.html -->
      <!-- include forms/settings/water.html -->
      <!-- include forms/settings/snooze.html -->
      <!-- include forms/settings/appointment.html -->
      <!-- include forms/settings/backup.html -->
    </div>
    <button id="save-appointment-settings" type="submit" form="appointment-settings-form" class="block-action" hidden>{{msg:ui.save-appointment-settings}}</button>
    <p id="settings-status" role="status" class="settings-message"></p>
  </dialog>
