  <dialog id="delete-dialog" class="confirm-dialog" role="alertdialog" aria-labelledby="delete-title" aria-describedby="delete-message">
    <form id="delete-form">
      <h2 id="delete-title"></h2>
      <p id="delete-message"></p>
      <p id="delete-error" class="field-error" role="alert"></p>
      <div class="panel-action-bar">
        <button type="button" class="secondary" id="cancel-delete" autofocus>{{msg:ui.cancel}}</button>
        <button type="submit" class="danger-button" id="confirm-delete">{{msg:ui.delete}}</button>
      </div>
    </form>
  </dialog>
