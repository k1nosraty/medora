  <dialog id="delete-dialog" class="confirm-dialog" role="alertdialog" aria-labelledby="delete-title" aria-describedby="delete-message">
    <form id="delete-form">
      <h2 id="delete-title"></h2>
      <p id="delete-message"></p>
      <p id="delete-error" class="field-error" role="alert"></p>
      <div class="action-pair">
        <button type="button" class="secondary" id="cancel-delete" autofocus>انصراف</button>
        <button type="submit" class="danger-button" id="confirm-delete">حذف</button>
      </div>
    </form>
  </dialog>
