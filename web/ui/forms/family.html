<dialog id="family-dialog" class="sheet shared-panel" aria-labelledby="family-title">
  <div class="sheet-header">
    <svg id="family-mark" aria-hidden="true"><use href="#i-mark"/></svg>
    <button id="family-back" class="icon-button" type="button" aria-label="{{msg:ui.back}}" hidden><svg aria-hidden="true"><use href="#i-back"/></svg></button>
    <h2 id="family-title" tabindex="-1">{{msg:ui.care-groups}}</h2>
    <button class="icon-button" type="button" data-close="family-dialog" aria-label="{{msg:ui.close}}"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
  </div>
  <div class="sheet-body family-body">
    <p id="family-status" role="status" hidden></p>
    <div id="family-content" class="family-content"></div>
  </div>
</dialog>
<template id="family-share-template">
  <form class="family-content">
    <p data-recipient class="family-target"></p>
    <fieldset class="family-choice">
      <legend>{{msg:ui.view}}</legend>
      <label><input type="radio" name="view" value="all" checked>{{msg:ui.view-everything}}</label>
      <label><input type="radio" name="view" value="custom">{{msg:ui.choose-sections}}</label>
      <p class="quiet" data-scope>{{msg:ui.profile-medication-dose-history-appointments-routines-wat}}</p>
      <p class="quiet">{{msg:ui.family-custom-private-sections}}</p>
      <div data-sections hidden></div>
    </fieldset>
    <fieldset class="family-choice">
      <legend>{{msg:ui.recording-and-scheduling-permissions}}</legend>
      <label><input type="checkbox" name="record" role="switch">{{msg:ui.record-on-their-behalf}}</label>
      <label><input type="checkbox" name="add" role="switch">{{msg:ui.add-a-schedule}}</label>
    </fieldset>
    <label>{{msg:ui.access-duration}}
      <select name="days"><option value="">{{msg:ui.until-revoked}}</option><option value="7">{{msg:ui.7-days}}</option><option value="30">{{msg:ui.30-days}}</option><option value="90">{{msg:ui.90-days}}</option></select>
    </label>
    <button type="submit" class="block-action">{{msg:ui.grant-access}}</button>
  </form>
</template>
