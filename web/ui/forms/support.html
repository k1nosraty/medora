  <dialog id="support-dialog" class="sheet" aria-labelledby="support-title">
    <div class="sheet-header">
      <h2 id="support-title">{{msg:ui.medora-support}}</h2>
      <button type="button" class="icon-button" data-close="support-dialog" aria-label="{{msg:ui.close}}"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body">
      <form id="support-form">
        <label>{{msg:ui.describe-the-issue}}<textarea id="support-message" rows="4" maxlength="1000" required></textarea></label>
        <p class="quiet">{{msg:ui.please-leave-health-information-and-account-passwords-out}}</p>
        <label><input id="support-diagnostics" type="checkbox">{{msg:ui.include-app-version-device-type-and-notification-permissi}}</label>
        <button type="submit" class="block-action">{{msg:ui.send-report}}</button>
      </form>
      <p id="support-status" role="status"></p>
      <a id="support-sign-in" href="/medication/?view=account" hidden>{{msg:ui.sign-in-to-medora-2}}</a>
      <div id="support-history"></div>
    </div>
  </dialog>
