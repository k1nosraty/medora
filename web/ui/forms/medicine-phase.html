  <template id="phase-template">
    <fieldset class="phase">
      <legend>{{msg:ui.schedule-stage}}</legend>
      <label class="plan-repeat">{{msg:ui.repeat}}
        <select class="repeat">
          <option value="daily">{{msg:ui.every-day}}</option>
          <option value="weekly">{{msg:ui.days-of-the-week}}</option>
          <option value="dates">{{msg:ui.selected-dates}}</option>
        </select>
      </label>
      <div class="fields plan-dates">
        <label>{{msg:ui.start-date-2}}<input class="start" type="date" required></label>
        <label>{{msg:ui.end-date-optional-2}}<input class="end" type="date"></label>
      </div>
      <div class="weekly-plan" hidden>
        <label>{{msg:ui.repeat-interval-weeks}}<input class="interval" type="number" inputmode="numeric" dir="ltr" min="1" max="52" value="1" required></label>
        <div class="weekdays" role="group" aria-label="{{msg:ui.days-to-take-medicine}}"></div>
      </div>
      <div class="exact-plan" hidden>
        <p class="quiet">{{msg:ui.the-times-and-doses-below-apply-to-each-selected-date}}</p>
        <div class="exact-days"></div>
        <button type="button" class="secondary add-exact-day">{{msg:ui.add-a-date}}</button>
      </div>
      <div class="doses-heading"><h4>{{msg:ui.doses}}</h4><button type="button" class="text-button dose-unit-link"></button></div>
      <div class="slots"></div>
      <div class="buttons">
        <button type="button" class="add-slot secondary">{{msg:ui.add-a-dose}}</button>
        <button type="button" class="remove-phase secondary phase-only">{{msg:ui.remove-stage}}</button>
      </div>
    </fieldset>
  </template>
