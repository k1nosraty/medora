  <dialog id="routine-editor" class="sheet add-sheet routine-sheet" aria-labelledby="routine-editor-title">
    <form id="routine-form" class="sheet-form" novalidate>
      <div class="sheet-header program-routine">
        <img class="glass-object add-sheet-icon" data-art="routine" src="/design/optical-glass/routine.webp" width="256" height="256" loading="lazy" alt="">
        <h2 id="routine-editor-title">{{msg:ui.new-routine}}</h2><button type="button" class="icon-button" data-close="routine-editor" aria-label="{{msg:ui.close}}"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
      <div class="sheet-body routine-fields">
        <label class="editor-field">{{msg:ui.routine-name}}<input id="routine-name" type="text" dir="auto" maxlength="80" placeholder="{{msg:ui.e-g-morning-stretch}}" required></label>
        <div class="routine-category-choice">
          <span>{{msg:ui.routine-type}}</span>
          <button id="routine-category-open" type="button" class="secondary" aria-haspopup="dialog">
            <span class="routine-glyph" id="routine-preview"></span>
            <span id="routine-category-label"></span>
            <svg aria-hidden="true"><use href="#i-expand"/></svg>
          </button>
        </div>
        <fieldset id="routine-colors"><legend>{{msg:ui.routine-color}}</legend><div class="visit-color-grid"></div></fieldset>
        <fieldset class="routine-schedule">
          <legend>{{msg:ui.repeat-2}}</legend>
          <select id="routine-repeat" aria-label="{{msg:ui.repeat-2}}"><option value="daily">{{msg:ui.every-day}}</option><option value="weekly">{{msg:ui.selected-days}}</option></select>
          <div id="routine-weekly" class="routine-fields" hidden>
            <div id="routine-weekdays" class="weekdays" role="group" aria-label="{{msg:ui.repeat-days}}"></div>
            <label>{{msg:ui.repeat-interval}}<select id="routine-interval"><option value="1">{{msg:ui.every-week}}</option><option value="2">{{msg:ui.every-two-weeks}}</option><option value="3">{{msg:ui.every-three-weeks}}</option><option value="4">{{msg:ui.every-four-weeks}}</option></select></label>
          </div>
        </fieldset>
        <details class="editor-options" id="routine-options">
          <summary>{{msg:ui.goal-time-and-details}}</summary>
          <div class="routine-fields">
            <div class="routine-time-fields">
              <label>{{msg:ui.start-date}}<input id="routine-start" type="date" required></label>
              <label>{{msg:ui.routine-time}}<input id="routine-time" type="time"></label>
            </div>
            <label class="routine-check"><input id="routine-reminder" type="checkbox">{{msg:ui.notify-me-at-the-routine-time}}</label>
            <p id="routine-reminder-help" class="quiet" hidden>{{msg:ui.enable-this-devices-notifications-in-settings-to-receive}}</p>
            <label>{{msg:ui.tracking-method}}<select id="routine-mode"><option value="done">{{msg:ui.done}}</option><option value="quantity">{{msg:ui.quantity-goal}}</option><option value="steps">{{msg:ui.checklist}}</option></select></label>
            <div id="routine-target-fields" class="routine-time-fields" hidden>
              <label>{{msg:ui.target-amount}}<input id="routine-target" type="text" inputmode="numeric" dir="ltr" maxlength="5" placeholder="{{msg:ui.20}}"></label>
              <label>{{msg:ui.unit}}<input id="routine-unit" type="text" dir="auto" maxlength="24" placeholder="{{msg:ui.minutes-pages-or-reps}}"></label>
            </div>
            <label id="routine-steps-field" hidden>{{msg:ui.steps-one-per-line}}<textarea id="routine-steps" rows="3" dir="auto" maxlength="840" placeholder="شست‌وشو&#10;مرطوب‌کننده&#10;ضدآفتاب"></textarea></label>
            <label>{{msg:ui.note-optional}}<textarea id="routine-notes" rows="2" dir="auto" maxlength="320"></textarea></label>
          </div>
        </details>
        <p id="routine-editor-status" class="field-error" role="alert"></p>
        <button id="routine-save" type="submit" class="block-action">{{msg:ui.save-routine}}</button>
        <div id="routine-management" hidden>
          <button id="routine-pause" class="secondary" type="button">{{msg:ui.pause-routine}}</button>
          <button id="routine-delete" class="secondary danger" type="button">{{msg:ui.delete-routine}}</button>
        </div>
      </div>
    </form>
  </dialog>
