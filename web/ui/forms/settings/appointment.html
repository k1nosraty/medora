      <section id="appointment-settings" class="settings-panel" hidden>
        <form id="appointment-settings-form" novalidate>
          <label>شروع یادآوری در روز قرار<input id="appointment-reminders-start" type="time" value="08:00" required></label>
          <label>تکرار تا ساعت قرار<select id="appointment-reminders-interval"><option value="60">هر ساعت</option><option value="120">هر دو ساعت</option></select></label>
          <p class="quiet">برای قرارهای زودتر از ساعت شروع، یک یادآوری یک ساعت قبل از قرار ارسال می‌شود.</p>
          <button type="submit" class="block-action">ذخیرهٔ تنظیمات قرار</button>
        </form>
      </section>
