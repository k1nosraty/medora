      <section id="profile-settings" class="settings-panel" hidden>
        <form id="profile-form">
          <label>جنسیت (اختیاری)
            <select id="profile-gender">
              <option value="">انتخاب نشده</option>
              <option value="female">خانم</option>
              <option value="male">آقا</option>
              <option value="undisclosed">ترجیح می‌دهم نگویم</option>
            </select>
          </label>
          <label class="feature-head editor-switch settings-switch profile-cycle-switch">
            چرخهٔ قاعدگی
            <input id="profile-cycle-enabled" type="checkbox" role="switch" aria-describedby="profile-cycle-hint">
          </label>
          <p id="profile-cycle-hint" class="quiet"></p>
          <button type="submit" class="block-action">ذخیرهٔ پروفایل</button>
        </form>
      </section>
