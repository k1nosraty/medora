        <section class="cycle-panel" id="cycle-tracking">
          <h2>{{msg:ui.cycle-daily-records}}</h2>
          <p id="cycle-patterns" class="quiet"></p>
          <div id="cycle-symptom-map" data-context-list></div>
          <ul id="cycle-pattern-list"></ul>
          <div id="cycle-daily-records" data-context-list></div>
        </section>
        <section class="cycle-panel" id="cycle-personal-tools">
          <details id="cycle-preparation" hidden>
            <summary>{{msg:ui.cycle-checklist}}</summary>
            <div id="cycle-preparation-list"></div>
          </details>
          <details>
            <summary>{{msg:ui.cycle-bulk}}</summary>
            <form id="cycle-bulk-form" class="settings-form">
              <div id="cycle-bulk-rows"></div>
              <button type="button" id="cycle-bulk-add" class="secondary">{{msg:ui.cycle-bulk-add}}</button>
              <p id="cycle-bulk-error" class="field-error" role="alert"></p>
              <button type="submit" class="block-action">{{msg:ui.save}}</button>
            </form>
          </details>
          <details>
            <summary>{{msg:ui.cycle-visit-report}}</summary>
            <form id="cycle-print-form" class="settings-form">
              <div class="sleep-fields">
                <label>{{msg:ui.start-date}}<input type="date" id="cycle-print-first" required></label>
                <label>{{msg:ui.end-date-optional}}<input type="date" id="cycle-print-last" required></label>
              </div>
              <label class="cycle-choice"><input type="checkbox" id="cycle-print-symptoms" checked> {{msg:ui.cycle-symptoms}}</label>
              <label class="cycle-choice"><input type="checkbox" id="cycle-print-meds"> {{msg:ui.medicines}}</label>
              <label class="cycle-choice"><input type="checkbox" id="cycle-print-notes"> {{msg:ui.sleep-note}}</label>
              <p id="cycle-print-error" class="field-error" role="alert"></p>
              <button type="submit" class="block-action">{{msg:ui.cycle-print-pdf}}</button>
            </form>
          </details>
          <button id="cycle-open-settings" type="button" class="secondary">{{msg:ui.cycle-tracking-settings}}</button>
        </section>
