<section class="plan-panel-banner program-banner-surface program-{{param:kind}}" aria-labelledby="{{param:titleId}}">
  <div>
    <h2 id="{{param:titleId}}">{{msg:{{param:title}}}}</h2>
    <p id="{{param:summaryId}}" aria-live="polite"></p>
    <button id="{{param:buttonId}}" type="button" class="secondary plan-panel-add" data-open-{{param:action}}><svg aria-hidden="true"><use href="#i-plus"/></svg>{{msg:{{param:button}}}}</button>
  </div>
  <svg data-surface-art="{{param:art}}" class="category-art {{param:artClass}}" viewBox="{{param:viewBox}}" aria-hidden="true"><use href="{{param:href}}"/></svg>
</section>
