  <header class="app-bar">
    <div class="app-bar-inner">
      <div class="brand-mark"><svg aria-hidden="true"><use href="#i-mark"/></svg></div>
      <button id="screen-back" type="button" class="icon-button" aria-label="بازگشت" hidden><svg aria-hidden="true"><use href="#i-back"/></svg></button>
      <span class="wordmark">مدورا</span>
      <div class="header-tools">
        <button type="button" class="icon-button language-switch" data-language-switch lang="en" aria-label="تغییر زبان به انگلیسی"><svg aria-hidden="true"><use href="#i-globe"/></svg><span>EN</span></button>
        <button type="button" class="icon-button" id="update-app" aria-label="به‌روزرسانی برنامه" title="به‌روزرسانی برنامه"><svg aria-hidden="true"><use href="#i-refresh"/></svg></button>
        <button type="button" class="icon-button" id="open-account" data-open-account aria-label="حساب کاربری"><svg aria-hidden="true"><use href="#i-user"/></svg></button>
        <button type="button" class="icon-button" data-destination="settings" aria-label="تنظیمات"><svg aria-hidden="true"><use href="#i-settings"/></svg></button>
      </div>
    </div>
    <p id="app-update-status" role="status"></p>
  </header>
