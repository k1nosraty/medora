  <header class="app-bar">
    <div class="app-bar-inner">
      <div class="brand-mark"><svg aria-hidden="true"><use href="#i-mark"/></svg></div>
      <button id="screen-back" type="button" class="icon-button" aria-label="{{msg:ui.back}}" hidden><svg aria-hidden="true"><use href="#i-back"/></svg></button>
      <span class="wordmark">{{msg:ui.medora}}</span>
      <div class="header-tools">
        <button type="button" class="icon-button language-switch" data-language-switch lang="en" aria-label="{{msg:ui.switch-to-english}}"><svg aria-hidden="true"><use href="#i-globe"/></svg><span>EN</span></button>
        <button type="button" class="icon-button" id="update-app" aria-label="{{msg:ui.update-app}}" title="{{msg:ui.update-app}}"><svg aria-hidden="true"><use href="#i-refresh"/></svg></button>
        <button type="button" class="icon-button care-inbox" id="open-care-inbox" aria-label="{{msg:ui.received-invitations}}" hidden><svg aria-hidden="true"><use href="#i-bell"/></svg><span id="care-inbox-count" aria-hidden="true"></span></button>
        <button type="button" class="icon-button" id="open-account" data-open-account aria-label="{{msg:ui.account}}"><svg aria-hidden="true"><use href="#i-user"/></svg></button>
        <button type="button" class="icon-button" data-destination="settings" aria-label="{{msg:ui.settings}}"><svg aria-hidden="true"><use href="#i-settings"/></svg></button>
      </div>
    </div>
    <p id="app-update-status" role="status"></p>
  </header>
