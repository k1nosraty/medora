          <time id="story-date" class="story-label"></time>
          <h2 id="story-title">امروز با مدورا</h2>
          <p id="story-summary"></p>
        </div>
        <img class="story-art" src="/medication/assets/illustrations/care.svg" width="560" height="350" alt="">

        <button type="button" class="secondary day-arrow icon-button reverse" id="next-day" aria-label="روز بعد"><svg aria-hidden="true"><use href="#i-back"/></svg></button>
      </div>
