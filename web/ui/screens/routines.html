      <div data-screen="routines" hidden>
        <section class="plan-panel-banner program-routine" aria-labelledby="routine-banner-title">
          <div><h2 id="routine-banner-title">{{msg:ui.my-routines}}</h2><p id="routine-progress" aria-live="polite"></p>
            <button id="routine-add" type="button" class="secondary plan-panel-add" data-open-routine><svg aria-hidden="true"><use href="#i-plus"/></svg>{{msg:ui.new-routine}}</button>
          </div>
          <svg class="category-art routine-category-art" viewBox="0 0 128 100" aria-hidden="true"><use href="/medication/assets/icons/routines.svg#banner"/></svg>
        </section>
        <div id="routine-dates" data-day-host="routines"></div>
        <div class="plan-panel-filters segmented glass-toolbar program-routine" role="group" aria-label="{{msg:ui.routine-view}}">
          <button type="button" data-routine-filter="today" aria-pressed="true">{{msg:ui.today}}</button>
          <button type="button" data-routine-filter="all" aria-pressed="false">{{msg:ui.all}}</button>
          <button type="button" data-routine-filter="history" aria-pressed="false">{{msg:ui.history}}</button>
        </div>
        <label class="routine-search" id="routine-search-wrap" hidden>{{msg:ui.search-routines}}<input id="routine-search" type="search" placeholder="{{msg:ui.routine-name-or-category}}"></label>
        <div id="routine-list" class="plan-panel-list" data-context-list></div>
        <button type="button" class="secondary block-action" id="routine-more" hidden>{{msg:ui.more-history}}</button>
      </div>
