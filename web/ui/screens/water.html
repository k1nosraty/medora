      <div data-screen="water" hidden>
        <div data-day-host="water"></div>
        <section class="feature water program-water water-history-card program-banner-surface" aria-labelledby="water-history-title">
          <div id="water-summary" class="water-summary">
            <!-- include layout/water-glass.html -->
            <div class="water-info"><h2 id="water-history-title">{{msg:ui.water-intake}}</h2><strong id="water-date"></strong><p class="amount-line"><strong id="water-total">{{msg:ui.0}}</strong> {{msg:ui.of}} <span id="water-goal-label">{{msg:ui.2-000}}</span> {{msg:ui.ml}}</p><progress class="water-progress" id="water-progress" max="1" value="0" aria-label="{{msg:ui.water-goal-progress}}"></progress><p class="quiet" id="water-remaining"></p></div>
          </div>
          <div id="water-entry">
            <div class="water-quick glass-secondary-actions">
              <button type="button" data-water-add="150"><b>{{msg:ui.150-2}}</b><small>{{msg:ui.ml}}</small></button>
              <button type="button" data-water-add="250"><b>{{msg:ui.250-2}}</b><small>{{msg:ui.ml}}</small></button>
              <button type="button" data-water-add="500"><b>{{msg:ui.500-2}}</b><small>{{msg:ui.ml}}</small></button>
            </div>
          </div>
          <button id="water-custom-action" type="button" class="secondary block-action glass-secondary-action" data-open-water>{{msg:ui.custom-amount}}</button>
        </section>
        <section class="water-history-entries"><h2>{{msg:ui.water-log}}</h2><div id="water-entries" data-context-list></div></section>
      </div>
