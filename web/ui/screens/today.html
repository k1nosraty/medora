      <div data-screen="today" class="daily-sheet">
        <!-- include layout/program-cards.html -->
        <!-- include layout/today-water.html -->
        <div class="daily-main">
          <div class="daily-heading">
            <h2 id="day-title">{{msg:ui.daily-timeline}}</h2>
            <output id="today-count" aria-label="{{msg:ui.daily-plan-progress}}" hidden></output>
          </div>
          <div id="today-focus" data-context-list hidden></div>
        </div>
        <div class="daily-timeline">
          <p id="future-schedule" class="quiet" hidden>{{msg:ui.upcoming-schedule-you-can-log-doses-on-or-after-the-sched}}</p>
          <section class="timeline" aria-labelledby="timeline-title">
            <div class="timeline-heading">
              <h3 id="timeline-title">{{msg:ui.doses-appointments-and-routines}}</h3>
              <label class="timeline-sort">
                <svg aria-hidden="true"><use href="#i-sort"/></svg>
                <select id="timeline-order" aria-label="{{msg:ui.sort-day-schedule}}">
                  <option value="default">{{msg:ui.schedule-default-order}}</option>
                  <option value="earliest">{{msg:ui.earliest-first}}</option>
                  <option value="latest">{{msg:ui.latest-first}}</option>
                </select>
              </label>
            </div>
            <div id="doses" data-context-list></div>
          </section>
        </div>
        <div id="today-family-bottom"></div>
        <section id="today-reminders" class="feature mist" hidden>
          <h2>{{msg:ui.reminders}}</h2>
          <p class="quiet">{{msg:ui.set-up-this-device-to-get-reminders-when-medora-is-closed}}</p>
          <button type="button" class="secondary" data-destination="settings" data-open-notifications>{{msg:ui.notification-settings}}</button>
        </section>
      </div>
