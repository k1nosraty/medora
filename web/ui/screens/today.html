      <div data-screen="today" class="daily-sheet">
        <!-- include layout/program-cards.html -->
        <!-- include layout/cycle-today.html -->
        <!-- include layout/today-water.html -->
        <section class="cycle-panel program-cycle" id="cycle-companion-card" hidden>
          <h2>{{msg:ui.cycle}}</h2><p id="cycle-companion-estimate"></p><p id="cycle-companion-message" dir="auto"></p>
        </section>
        <div class="daily-main">
          <div class="daily-heading">
            <h2 id="day-title">{{msg:ui.daily-timeline}}</h2>
            <div id="day-focus-navigation" class="day-focus-controls" hidden></div>
            <output id="today-count" aria-label="{{msg:ui.daily-plan-progress}}" hidden></output>
          </div>
          <div id="today-focus" data-context-list hidden></div>
        </div>
        <!-- include layout/today-sleep.html -->
        <div class="daily-timeline">
          <p id="future-schedule" class="quiet" hidden>{{msg:ui.upcoming-schedule-you-can-log-doses-on-or-after-the-sched}}</p>
          <section class="timeline" aria-labelledby="timeline-title">
            <div class="timeline-heading">
              <h3 id="timeline-title">{{msg:ui.doses-appointments-and-routines}}</h3>
              <label class="timeline-sort">
                <svg aria-hidden="true"><use href="#i-sort"/></svg>
                <select id="timeline-order" aria-label="{{msg:ui.sort-day-schedule}}">
                  <option value="default">{{msg:ui.schedule-default-order}}</option>
                  <option value="earliest">{{msg:ui.earliest-first}}</option>
                  <option value="latest">{{msg:ui.latest-first}}</option>
                </select>
              </label>
            </div>
            <div id="doses" class="compact-card-list" data-context-list></div>
          </section>
        </div>
        <div id="today-family-bottom"></div>
        <section id="today-reminders" class="feature mist" hidden>
          <h2>{{msg:ui.reminders}}</h2>
          <p class="quiet">{{msg:ui.set-up-this-device-to-get-reminders-when-medora-is-closed}}</p>
          <button type="button" class="secondary" data-destination="settings" data-open-notifications>{{msg:ui.notification-settings}}</button>
        </section>
        <aside id="today-promotion" class="feature" aria-labelledby="today-promotion-label" hidden>
          <p id="today-promotion-label" class="quiet">{{msg:ui.sponsored-message}}</p>
          <p id="today-promotion-title" dir="auto"></p>
          <div class="buttons">
            <button id="today-promotion-open" type="button" class="secondary" aria-haspopup="dialog">{{msg:ui.promotion-open}}</button>
            <button id="today-promotion-dismiss" type="button" class="text-button">{{msg:ui.promotion-dismiss}}</button>
          </div>
        </aside>
        <div class="tracker-feedback-stack">
          <!-- include layout/water-feedback.html -->
          <div id="today-cycle-feedback" class="tracker-feedback program-cycle" hidden>
            <span id="today-cycle-message" role="status"></span>
            <button type="button" class="secondary glass-secondary-action tracker-utility" id="today-cycle-undo">{{msg:ui.undo-log}}</button>
            <button type="button" class="icon-button" id="today-cycle-dismiss" aria-label="{{msg:ui.close}}"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
          </div>
        </div>
      </div>
