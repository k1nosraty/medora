<div class="gallery-month program-cycle">
  <div class="gallery-month-head">
    <button id="gallery-month-previous" class="icon-button gallery-arrow" type="button" aria-label="ماه قبل" data-en-aria-label="Previous month"><svg aria-hidden="true"><use href="#i-expand"/></svg></button>
    <strong id="gallery-month-label" aria-live="polite"></strong>
    <button id="gallery-month-next" class="icon-button gallery-arrow" type="button" aria-label="ماه بعد" data-en-aria-label="Next month"><svg aria-hidden="true"><use href="#i-expand"/></svg></button>
  </div>
  <div id="gallery-month-days" class="gallery-calendar" aria-label="روزهای ماه" data-en-aria-label="Days of the month"></div>
  <div class="gallery-calendar-footer">
    <div id="gallery-calendar-legend" class="gallery-calendar-legend">
      <span id="gallery-legend-recorded" data-en="Logged">ثبت‌شده</span>
      <span id="gallery-legend-forecast" data-en="Estimated">تخمینی</span>
    </div>
    <button id="gallery-month-reset" class="text-button" type="button" data-en="Back to today">بازگشت به امروز</button>
  </div>
</div>
<p id="gallery-agenda-date" class="quiet"></p>
